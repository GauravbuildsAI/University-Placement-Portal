{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">⚙️ Edit Profile & Upload Resume</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" value="{{ student.full_name }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Roll Number</label>
                            <input type="text" class="form-control" value="{{ student.roll_no }}" disabled>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ student.phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Current CGPA</label>
                            <input type="number" step="0.01" name="cgpa" class="form-control" value="{{ student.cgpa }}" required>
                        </div>
                    </div>
                    <hr>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Upload Resume (PDF only)</label>
                        <input type="file" name="resume" class="form-control" accept=".pdf">
                        {% if student.resume_file %}
                            <div class="mt-2 text-success">
                                <i class="bi bi-check-circle-fill"></i> Current Resume: <strong>{{ student.resume_file }}</strong>
                            </div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
