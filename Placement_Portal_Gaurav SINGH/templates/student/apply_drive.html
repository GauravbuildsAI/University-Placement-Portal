{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h5 class="mb-0">Apply for {{ drive.job_title }}</h5>
            </div>
            <div class="card-body p-4">
                <h5 class="text-primary text-center mb-4">{{ drive.company.company_name }}</h5>
                <p class="text-muted mb-4">{{ drive.job_description }}</p>
                <hr>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Confirm Your Student Email</label>
                        <input type="email" name="student_email" class="form-control" required placeholder="Enter your registered email">
                        <small class="text-muted">Required to link the application to your profile.</small>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold mb-2">Submit Application</button>
                    <a href="{{ url_for('student_drives') }}" class="btn btn-outline-secondary w-100">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
