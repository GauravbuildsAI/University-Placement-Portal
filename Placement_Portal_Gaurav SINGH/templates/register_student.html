{% extends 'base.html' %}

{% block content %}
<h2>Student Registration</h2>
<form method="POST">
    <input type="text" name="full_name" class="form-control mb-2" placeholder="Full Name" required>
    <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
    <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
    <input type="text" name="roll_no" class="form-control mb-2" placeholder="Roll Number" required>
    <input type="text" name="course" class="form-control mb-2" placeholder="Course" required>
    <input type="text" name="branch" class="form-control mb-2" placeholder="Branch" required>
    <input type="number" step="0.01" name="cgpa" class="form-control mb-2" placeholder="CGPA" required>
    <input type="text" name="phone" class="form-control mb-2" placeholder="Phone Number" required>
    <button type="submit" class="btn btn-success">Register</button>
</form>
{% endblock %}
